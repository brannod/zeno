name: Build Zeno updater release

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: bash
        run: |
          test -f VERSION
          TAG="$(tr -d '\r\n ' < VERSION)"
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9._-]+)?$'; then
            echo "Invalid VERSION: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Validate modular source
        shell: bash
        run: |
          test -f zeno.py
          test -f app.html
          test -f config.py
          test -f http_server.py
          test -f database.py
          test -f discord_bridge.py
          test -f browser_agent.py
          test -f updater.py
          for FILE in ./*.py; do python -m py_compile "$FILE"; done

      - name: Build clean complete updater ZIP
        id: package
        shell: bash
        env:
          VERSION_NUMBER: ${{ steps.version.outputs.version }}
        run: |
          rm -rf dist
          mkdir -p dist/Zeno

          # Zeno is modular now: every root Python module is part of the app.
          cp ./*.py dist/Zeno/

          FILES=(
            app.html
            VERSION
            requirements.txt
            START_ZENO.bat
            INSTALL_ZENO.bat
            README.txt
            FIRST_TIME_USER_GUIDE.txt
            DISCORD_GUIDE.txt
            ZENO_3.0_INTEGRATION_AUDIT.txt
            DISCORD_TOKEN.example.txt
          )
          for FILE in "${FILES[@]}"; do
            if [ -f "$FILE" ]; then cp "$FILE" dist/Zeno/; fi
          done

          for FILE in zeno-icon.png zeno-wallpaper.svg zeno.ico; do
            if [ -f "$FILE" ]; then cp "$FILE" dist/Zeno/; fi
          done

          # Never put live/private runtime state into a public release.
          rm -f dist/Zeno/DISCORD_TOKEN.txt

          ZIP="Zeno_v${VERSION_NUMBER}_COMPLETE_BUILD.zip"
          (cd dist && zip -qr "$ZIP" Zeno)
          echo "zip=dist/$ZIP" >> "$GITHUB_OUTPUT"
          echo "name=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Create or refresh GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading complete build."
            gh release upload "$TAG" "$ZIP" --clobber
            gh release edit "$TAG" --title "Zeno $TAG Complete Build" --latest
          else
            if ! git rev-parse "$TAG" >/dev/null 2>&1; then
              git tag "$TAG"
              git push origin "$TAG"
            fi
            gh release create "$TAG" "$ZIP" \
              --title "Zeno $TAG Complete Build" \
              --generate-notes \
              --latest
          fi

      - name: Summary
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PACKAGE: ${{ steps.package.outputs.name }}
        run: |
          echo "### Zeno complete release built" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "- Asset: $PACKAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Modular Python source included" >> "$GITHUB_STEP_SUMMARY"
          echo "- Private runtime data excluded" >> "$GITHUB_STEP_SUMMARY"
