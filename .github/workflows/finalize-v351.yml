name: Finalize Zeno v3.5.1

on:
  push:
    branches: [main]
    paths:
      - 'release-patches/v3.5.1/apply.json'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild source patch
        shell: bash
        run: |
          cat release-patches/v3.5.1/part0.patch \
              release-patches/v3.5.1/part1.patch \
              release-patches/v3.5.1/part2.patch \
              release-patches/v3.5.1/part3.patch > /tmp/v351.patch
          git apply --check /tmp/v351.patch
          git apply /tmp/v351.patch

      - name: Validate Zeno 3.5.1 source
        shell: bash
        run: |
          test "$(tr -d '\r\n ' < VERSION)" = "v3.5.1"
          test -f zeno.py
          test -f app.html
          test -f desktop_notetaker.py
          test -f database.py
          test -f http_server.py
          for FILE in ./*.py; do python -m py_compile "$FILE"; done

      - name: Build complete updater asset
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist/Zeno
          cp ./*.py dist/Zeno/
          FILES=(app.html VERSION requirements.txt START_ZENO.bat INSTALL_ZENO.bat README.txt FIRST_TIME_USER_GUIDE.txt DISCORD_GUIDE.txt ZENO_3.0_INTEGRATION_AUDIT.txt DISCORD_TOKEN.example.txt)
          for FILE in "${FILES[@]}"; do
            if [ -f "$FILE" ]; then cp "$FILE" dist/Zeno/; fi
          done
          for FILE in zeno-icon.png zeno-wallpaper.svg zeno.ico; do
            if [ -f "$FILE" ]; then cp "$FILE" dist/Zeno/; fi
          done
          rm -f dist/Zeno/DISCORD_TOKEN.txt
          (cd dist && zip -qr Zeno_v3.5.1_COMPLETE_GITHUB_UPDATER_RELEASE.zip Zeno)
          test -s dist/Zeno_v3.5.1_COMPLETE_GITHUB_UPDATER_RELEASE.zip

      - name: Commit real 3.5.1 source and clean staging files
        id: source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -rf release-patches/v3.5.1
          git rm .github/workflows/finalize-v351.yml
          git add zeno.py desktop_notetaker.py app.html database.py config.py http_server.py VERSION
          git commit -m 'Apply Zeno v3.5.1 source'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Move v3.5.1 tag to real source commit
        shell: bash
        run: |
          git tag -f v3.5.1 "${{ steps.source.outputs.sha }}"
          git push --force origin refs/tags/v3.5.1

      - name: Replace release asset and preserve exact title
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET='dist/Zeno_v3.5.1_COMPLETE_GITHUB_UPDATER_RELEASE.zip'
          gh release upload v3.5.1 "$ASSET" --clobber
          cat > /tmp/notes.md <<'EOF'
          ## Zeno v3.5.1

          Notetaker control and reliability update.

          ### Highlights
          - Auto-Watch saves immediately and stays off when disabled
          - Notetaker worker fully stops when Auto-Watch is off
          - Analyze Once no longer changes Auto-Watch state
          - Universal STOP control is visible in the chat composer
          - End Session control
          - Timeline search and event filters
          - Compact live activity list
          - Safe session_id database migration ordering

          Complete updater-safe modular release package. Private runtime data is excluded.
          EOF
          gh release edit v3.5.1 --title 'Zeno v3.5.1' --notes-file /tmp/notes.md --latest

      - name: Verify release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SIZE="$(gh release view v3.5.1 --json assets --jq '.assets[] | select(.name=="Zeno_v3.5.1_COMPLETE_GITHUB_UPDATER_RELEASE.zip") | .size')"
          test -n "$SIZE"
          test "$SIZE" -gt 200000
          echo "Verified complete asset size: $SIZE bytes"
