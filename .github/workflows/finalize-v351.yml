name: Finalize Zeno v3.5.1

on:
  push:
    branches: [main]
    paths:
      - 'release-patches/v3.5.1/apply.json'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging metadata
        uses: actions/checkout@v4

      - name: Download complete Zeno 3.5.0 base
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/base /tmp/work
          mkdir -p /tmp/base /tmp/work
          gh release download v3.5.0 --pattern '*COMPLETE*.zip' --dir /tmp/base
          ZIP="$(find /tmp/base -maxdepth 1 -type f -name '*.zip' | sort | tail -n 1)"
          test -n "$ZIP"
          unzip -q "$ZIP" -d /tmp/work
          SOURCE="$(find /tmp/work -type f -name zeno.py -print -quit)"
          test -n "$SOURCE"
          echo "SOURCE_DIR=$(dirname "$SOURCE")" >> "$GITHUB_ENV"

      - name: Rebuild and apply 3.5.1 source patch
        shell: bash
        run: |
          cat release-patches/v3.5.1/part0.patch \
              release-patches/v3.5.1/part1.patch \
              release-patches/v3.5.1/part2.patch \
              release-patches/v3.5.1/part3.patch > /tmp/v351.patch
          cd "$SOURCE_DIR"
          patch --dry-run -p1 < /tmp/v351.patch
          patch -p1 < /tmp/v351.patch

      - name: Validate patched 3.5.1 source
        shell: bash
        run: |
          cd "$SOURCE_DIR"
          test "$(tr -d '\r\n ' < VERSION)" = "v3.5.1"
          test -f zeno.py
          test -f app.html
          test -f desktop_notetaker.py
          test -f database.py
          test -f http_server.py
          for FILE in ./*.py; do python -m py_compile "$FILE"; done

      - name: Build complete updater asset
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist/Zeno
          cd "$SOURCE_DIR"
          cp ./*.py "$GITHUB_WORKSPACE/dist/Zeno/"
          FILES=(app.html VERSION requirements.txt START_ZENO.bat INSTALL_ZENO.bat README.txt FIRST_TIME_USER_GUIDE.txt DISCORD_GUIDE.txt ZENO_3.0_INTEGRATION_AUDIT.txt DISCORD_TOKEN.example.txt)
          for FILE in "${FILES[@]}"; do
            if [ -f "$FILE" ]; then cp "$FILE" "$GITHUB_WORKSPACE/dist/Zeno/"; fi
          done
          for FILE in zeno-icon.png zeno-wallpaper.svg zeno.ico; do
            if [ -f "$FILE" ]; then cp "$FILE" "$GITHUB_WORKSPACE/dist/Zeno/"; fi
          done
          rm -f "$GITHUB_WORKSPACE/dist/Zeno/DISCORD_TOKEN.txt"
          cd "$GITHUB_WORKSPACE/dist"
          zip -qr Zeno_v3.5.1_COMPLETE_GITHUB_UPDATER_RELEASE.zip Zeno
          test -s Zeno_v3.5.1_COMPLETE_GITHUB_UPDATER_RELEASE.zip

      - name: Replace v3.5.1 release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET='dist/Zeno_v3.5.1_COMPLETE_GITHUB_UPDATER_RELEASE.zip'
          gh release upload v3.5.1 "$ASSET" --clobber
          cat > /tmp/notes.md <<'EOF'
          ## Zeno v3.5.1

          Notetaker control and reliability update.

          ### Highlights
          - Auto-Watch saves immediately and stays off when disabled
          - Notetaker worker fully stops when Auto-Watch is off
          - Analyze Once no longer changes Auto-Watch state
          - Universal STOP control is visible in the chat composer
          - End Session control
          - Timeline search and event filters
          - Compact live activity list
          - Safe session_id database migration ordering

          Complete updater-safe modular release package. Private runtime data is excluded.
          EOF
          gh release edit v3.5.1 --title 'Zeno v3.5.1' --notes-file /tmp/notes.md --latest

      - name: Verify final release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SIZE="$(gh release view v3.5.1 --json assets --jq '.assets[] | select(.name=="Zeno_v3.5.1_COMPLETE_GITHUB_UPDATER_RELEASE.zip") | .size')"
          test -n "$SIZE"
          test "$SIZE" -gt 200000
          echo "Verified complete asset size: $SIZE bytes"
