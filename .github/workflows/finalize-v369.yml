name: Finalize Zeno v3.6.9 exact tag

on:
  push:
    branches: [main]
    paths:
      - 'release-patches/v3.6.9/release.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Download verified 3.6.9 updater asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/zeno-v369
          mkdir -p /tmp/zeno-v369
          gh release download 'v3.6.9' \
            --pattern 'Zeno_v3.6.9_COMPLETE_GITHUB_UPDATER_RELEASE.zip' \
            --dir /tmp/zeno-v369
          ASSET='/tmp/zeno-v369/Zeno_v3.6.9_COMPLETE_GITHUB_UPDATER_RELEASE.zip'
          test -f "$ASSET"
          test "$(stat -c '%s' "$ASSET")" = '341976'
          echo 'dae3b08dc4d8f513992528e53b2a2fe8c830ba3865ab7cb1fbcff1b3058da872  '"$ASSET" | sha256sum -c -

      - name: Publish requested exact release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v.3.6.9'
          TITLE='Zeno v3.6.9'
          ASSET='/tmp/zeno-v369/Zeno_v3.6.9_COMPLETE_GITHUB_UPDATER_RELEASE.zip'
          cat > /tmp/release-notes.md <<'EOF'
          Zeno 3.6.9 Direct Work + Long Replies.

          Includes Direct Work file behavior, restored deterministic Discord file commands, larger browser/Discord reply limits, and AYCD Profile Builder tool-discovery improvements.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file /tmp/release-notes.md --latest
          else
            gh release create "$TAG" "$ASSET" \
              --target main \
              --title "$TITLE" \
              --notes-file /tmp/release-notes.md \
              --latest
          fi

      - name: Verify exact release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view 'v.3.6.9' --json name,tagName,isLatest,assets,url
